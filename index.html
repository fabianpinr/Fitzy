<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador de Tallas - Fitzy</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
   :root {
    --primary: rgb(220, 211, 224);   /* tono lila suave */
    --secondary: rgb(238, 230, 227); /* tono beige claro */
    --accent: #4caf50;               /* verde para progreso */
    --text: #333;                    /* texto oscuro */
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Helvetica Neue', 'Montserrat', sans-serif;
    background: var(--secondary);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .votoOculto {
    color: white; /* conteo interno oculto al usuario */
  }

  .phone-frame {
    width: 100%;
    max-width: 400px;
    min-height: 540px;
    margin: 0 auto;
    border: 12px solid var(--primary);
    border-radius: 32px;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
    background: #fff;
    overflow-y: auto;
    padding: 20px 16px;
  }

  button {
    background: var(--primary);
    color: #333;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.3s;
  }

  button:hover {
    background: rgb(200, 190, 204);
  }

  .finalBar {
    height: 25px;
    background: var(--primary);
    width: 0%;
    margin-top: 10px;
    color: #333;
    text-align: center;
    border-radius: 8px;
    transition: width 0.5s ease;
    font-size: 14px;
  }

  .voteBarContainer {
    width: 100%;
    background: #eee;
    margin: 5px 0 12px 0;
    border-radius: 8px;
    overflow: hidden;
  }
